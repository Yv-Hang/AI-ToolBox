# 1. Spring应用名称
spring.application.name=AI-ToolBox

# 2. 服务器端口号，访问地址：http://localhost:8080
server.port=8080

# ====================== MySQL 数据库配置 ======================
# 数据库连接地址，IP地址:端口号/数据库名
spring.datasource.url=jdbc:mysql://192.168.88.12:3306/ToolBox?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

# MySQL 8.x 驱动类
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 数据库用户名
spring.datasource.username=root

# 数据库密码
spring.datasource.password=123456

# ====================== Redis 配置 ======================
# Redis 服务器IP地址
spring.data.redis.host=192.168.88.12

# Redis 服务器端口
spring.data.redis.port=6379

# Redis 服务器密码
spring.data.redis.password=123456

# 选择 Redis 数据库 0（Redis默认有16个数据库，编号0~15）
spring.data.redis.database=0

# ====================== Redis 连接池配置 ======================
# Redis 连接超时时间10000ms = 10秒
# 超时时间不宜过长，否则会影响系统响应速度
spring.data.redis.timeout=10000ms
# ====================== Redis 连接池配置 ======================

# 最大连接数8个
#spring.redis.lettuce.pool.max-active=8

# 最大阻塞等待时间-1毫秒
#spring.redis.lettuce.pool.max-wait=-1ms

# 最大空闲连接数
#spring.redis.lettuce.pool.max-idle=8

# 最小空闲连接数
#spring.redis.lettuce.pool.min-idle=0

# ====================== Snowflake 配置 ======================
# 数据中心ID
snowflake.datacenter-id=1
# 机器ID
snowflake.machine-id=1

mybatis-plus:
    type-aliases-package: com.example.aitoolbox
    mapper-locations: classpath:/mapper/**.xml
    configuration:
        map-underscore-to-camel-case: true



knife4j:
    # 开启增强配置，默认不开启，在yml中配置时，需要注意版本，在2.0.7+版本后
    # 建议开发者开启此配置
    enable: true
    # 是否开启生产环境屏蔽
    production: true
    # 配置
    setting:
        # 自定义主页
        # 开发者可以根据需求自定义主页内容
        enable-home-custom: true
        # 在4.1.0版本后，开发者可以自定义主页markdown文件路径
        home-custom-path: classpath:markdown/home.md
        # i18n配置
        # Knife4j默认提供中文(zh-cn)，英文(en)两种语言，开发者可以根据需求自行扩展
        language: zh-cn
        # 自定义Footer
        enable-footer: false    # 关闭默认的Footer信息展示，开发者设置为false即可
        enable-footer-custom: true    # 此属性为Boolean类型，默认为false，设置为true后，开发者可以自定义Footer信息
        footer-custom-content: Apache License 2.0 | Copyright  2019-[Knife4j](https://gitee.com/xiaoym/knife4j)    基于OpenAPI规范的Ui增强方案，Footer信息支持Markdown格式
        # 启用OpenApi规范
        enable-open-api: false    # 此属性为Boolean类型，控制是否启用OpenAPI规范，默认true(启用OpenAPI规范)，如果禁用OpenAPI规范，则设置为false

